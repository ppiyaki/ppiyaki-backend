spring:
  application:
    name: ppiyaki-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  reactor:
    context-propagation: auto
  jackson:
    time-zone: Asia/Seoul
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-4o-mini
      audio:
        transcription:
          options:
            model: whisper-1
            language: ko
  datasource:
    url: jdbc:h2:mem:ppiyaki;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # OSIV 비활성화 — SSE async 엔드포인트(ChatController.quickMessage 등)에서 EntityManager가
    # 응답 종료까지 잡혀 Hikari connection이 누수되는 사고 방지 (issue #350).
    # 트랜잭션 commit 직후 connection이 즉시 반환되도록 강제. Spring 공식 best practice.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-bytes-long}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:1209600000}

kakao:
  oidc:
    issuer: ${KAKAO_OIDC_ISSUER:https://kauth.kakao.com}
    jwks-uri: ${KAKAO_OIDC_JWKS_URI:https://kauth.kakao.com/.well-known/jwks.json}
    audience: ${KAKAO_OIDC_AUDIENCE:local-kakao-app-key}

mfds:
  api:
    base-url: apis.data.go.kr/1471000/DURPrdlstInfoService03
    connect-timeout: 2000
    read-timeout: 5000

openai:
  text-model: ${OPENAI_TEXT_MODEL:gpt-5.4-nano}
  vision-model: ${OPENAI_VISION_MODEL:gpt-5.4-mini}

fcm:
  project-id: ${FCM_PROJECT_ID:}
  credentials-json-base64: ${FCM_CREDENTIALS_JSON_BASE64:}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ppiyaki-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ppiyaki.push.send: true
        ppiyaki.llm.request: true
