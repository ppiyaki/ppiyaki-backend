spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 60s 이상 빌려간 채 반환 안 된 connection의 stack trace 로그 (진단용, issue #346).
      # 시연 직전 12:14~13:25 pool 고갈 사고 재발 시 leak 위치 즉시 확정 목적.
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  h2:
    console:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

ncp:
  storage:
    endpoint: ${NCP_STORAGE_ENDPOINT}
    region: ${NCP_STORAGE_REGION}
    access-key: ${NCP_STORAGE_ACCESS_KEY}
    secret-key: ${NCP_STORAGE_SECRET_KEY}
    bucket-name: ${NCP_STORAGE_BUCKET_NAME}
