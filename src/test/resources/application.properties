# 테스트 전용 설정.
#
# Spring 테스트 컨텍스트는 캐시되어 여러 개가 동시에 살아 있고, 컨텍스트마다
# HikariCP 풀이 따로 뜬다. 기본 풀 크기(10)로는 컨텍스트가 늘어날수록 커넥션이
# 누적되어 MySQL max_connections(기본 151)를 넘기고, 그 뒤에 만들어지는 컨텍스트는
# 커넥션을 얻지 못해 EntityManagerFactory 생성 단계에서 실패한다.
# 테스트는 동시 요청을 거의 만들지 않으므로 풀을 작게 잡는다.
# 다만 REQUIRES_NEW로 중첩 트랜잭션을 여는 경로(펫 포인트 등)가 있어 2로는 부족하다.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
