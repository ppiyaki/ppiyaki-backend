name: ppiyaki-monitoring

services:
  mysql:
    image: mysql:8.4.6
    container_name: ppiyaki-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ppiyaki}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ppiyaki-monitoring
    mem_limit: 1g
    ports:
      # host loopback에만 13306으로 publish. DataGrip 등 운영자 도구가
      # ssh tunnel(ppiyaki-prod) 후 127.0.0.1:13306으로 접근.
      # 0.0.0.0이 아닌 127.0.0.1 bind라 prod host 외부에서는 도달 불가.
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # backend는 같은 ppiyaki-monitoring 네트워크에서 mysql:3306 으로 직접 접근(host port 거치지 않음).
    # 데이터는 mysql-data 영속 볼륨에 보관. 외부 백업 없음 (spec db-self-hosted-migration §4 결정).

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ppiyaki-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - ppiyaki-monitoring
    # prometheus는 외부 노출 안 함. Grafana만 외부 노출 (admin 인증).

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ppiyaki-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ppiyaki-monitoring
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.3.2
    container_name: ppiyaki-loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - ppiyaki-monitoring
    # 외부 노출 안 함. Grafana는 같은 network에서 http://loki:3100으로 접근.

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: ppiyaki-alloy
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - ppiyaki-monitoring
    depends_on:
      - loki
    # docker socket은 read-only 마운트. 표준 패턴이지만 root socket 접근 권한임을 명시.

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  mysql-data:

networks:
  ppiyaki-monitoring:
    external: true
